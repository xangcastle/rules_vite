name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    buildifier:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true
            - name: Buildifier
              run: bazel run //:buildifier -- --mode=check --lint=warn $(git ls-files "*.bzl" "*.bazel" "BUILD.bazel" "MODULE.bazel")

    test:
        name: test (${{ matrix.workspace.slug }}, ${{ matrix.bazel.id }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                workspace:
                    - { path: ".", slug: "root", targets: "//private/... //docs/...", tests: "true" }
                    - { path: "e2e/vanilla", slug: "vanilla", targets: "//...", tests: "false" }
                    - { path: "e2e/react", slug: "react", targets: "//...", tests: "true", require: "--require //:unit_tests=5 --require //:declared_config_test=5" }
                    - { path: "e2e/shadcn", slug: "shadcn", targets: "//...", tests: "true" }
                    - { path: "e2e/nested", slug: "nested", targets: "//...", tests: "true" }
                    - { path: "example", slug: "example", targets: "//...", tests: "true" }
                bazel:
                    - { id: bazel-8, version: "", flags: "--lockfile_mode=error" }
                    - { id: bazel-9, version: "9.x", flags: "--lockfile_mode=update" }
        env:
            USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  disk-cache: ${{ matrix.workspace.slug }}-${{ matrix.bazel.id }}
            - name: Build
              working-directory: ${{ matrix.workspace.path }}
              run: bazel build ${{ matrix.bazel.flags }} -- ${{ matrix.workspace.targets }}
            - name: Test
              if: matrix.workspace.tests == 'true'
              working-directory: ${{ matrix.workspace.path }}
              run: bazel test ${{ matrix.bazel.flags }} -- ${{ matrix.workspace.targets }}
            - name: Test reports
              if: always() && matrix.workspace.tests == 'true'
              run: python3 .github/scripts/junit_report.py "${{ matrix.workspace.path }}" --targets ${{ matrix.workspace.targets }} ${{ matrix.workspace.require }}

    dev-server:
        name: dev-server (${{ matrix.case.slug }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                case:
                    - { path: "e2e/react", target: "//:web.dev", slug: "react-vite7-ts-config" }
                    - { path: "e2e/react", target: "//:web_deps.dev", slug: "react-deps-mode-links" }
                    - { path: "e2e/vanilla", target: "//:web.dev", slug: "vanilla-vite7-js-config" }
                    - { path: "example", target: "//apps/dashboard:app.dev", slug: "example-vite8-ts-config-overlays" }
                    - { path: "e2e/nested", target: "//apps/web:web_vite_derived.dev", slug: "nested-pnpm-importer" }
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  disk-cache: dev-server-${{ matrix.case.slug }}
            - name: Dev server smoke
              run: .github/scripts/dev_server_smoke.sh "${{ matrix.case.path }}" "${{ matrix.case.target }}" 5199 --lockfile_mode=error

    test-darwin:
        if: >-
            ${{ github.ref_name == 'main'
                || contains(github.head_ref || github.ref_name, 'macos') }}
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  disk-cache: darwin
            - name: Tests (unit, analysis, snapshots, docs drift)
              run: bazel test --lockfile_mode=error -- //private/... //docs/...
            - name: Consumer modules
              run: |
                  for module in e2e/vanilla e2e/react e2e/shadcn e2e/nested example; do
                      (cd "$module" && bazel build --lockfile_mode=update -- //...)
                      (cd "$module" && bazel test --lockfile_mode=update -- //... || [ $? -eq 4 ])
                  done

    test-all:
        name: test-all
        runs-on: ubuntu-latest
        needs: [buildifier, test, dev-server, test-darwin]
        if: always()
        steps:
            - name: All required jobs succeeded
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  DARWIN_GATED: ${{ github.ref_name == 'main' || contains(github.head_ref || github.ref_name, 'macos') }}
              run: |
                  set -euo pipefail
                  names=$(jq -r 'keys[]' <<<"${NEEDS}")
                  [ -n "${names}" ]
                  status=0
                  for name in ${names}; do
                      result=$(jq -r --arg n "${name}" '.[$n].result' <<<"${NEEDS}")
                      case "${name}:${result}" in
                          *:success) ;;
                          test-darwin:skipped)
                              if [ "${DARWIN_GATED}" = "true" ]; then
                                  echo "test-darwin was skipped although the darwin pipeline is gated on"
                                  status=1
                              fi
                              ;;
                          *)
                              echo "Required job did not succeed: ${name}=${result}"
                              status=1
                              ;;
                      esac
                  done
                  exit "${status}"
