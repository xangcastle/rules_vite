name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        bazel: [8.7.0, 9.2.0]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4
      - name: Buildifier lint
        run: bazel run //:buildifier -- --mode=check --lint=warn $(git ls-files "*.bzl" "*.bazel" "BUILD.bazel" "MODULE.bazel")
      - name: Unit tests
        run: bazel test //private/...
      - name: Snapshots (fails on drift)
        run: bazel test //private/snapshots:snapshots
      - name: API docs (fails on drift)
        run: bazel test //docs:update_docs
      - name: e2e apps
        run: |
          for example in e2e/vanilla e2e/react e2e/chadcn; do
            (cd "$example" && \
              bazel test --override_module=rules_vite="$GITHUB_WORKSPACE" //...)
          done
