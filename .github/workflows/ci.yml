name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        bazel: [8.7.0, 9.2.0]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4
      - name: Buildifier lint
        run: bazel run //:buildifier -- --mode=check --lint=warn $(git ls-files "*.bzl" "*.bazel" "BUILD.bazel" "MODULE.bazel")
      - name: Tests (unit, analysis, snapshots, docs drift)
        run: bazel test //private/... //docs/...
      - name: Consumer modules
        run: |
          for module in e2e/vanilla e2e/react e2e/shadcn example; do
            (cd "$module" && bazel build //...)
          done
          for module in e2e/react e2e/shadcn example; do
            (cd "$module" && bazel test //...)
          done
